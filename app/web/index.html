<!DOCTYPE html>
<html>
<head>
  <!--
    Flutter web bootstrap. The base href is updated by "flutter build web".
    For https://property.aderalabs.tech/ (root path, no prefix needed).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Munshi — آپ کا ڈیجیٹل منشی — Property dealer OS for Pakistan">

  <!-- iOS / PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Munshi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon & manifest -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Munshi</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Injected by flutter build — do not edit.
    var serviceWorkerVersion = null;
  </script>
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
