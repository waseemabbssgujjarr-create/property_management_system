name: munshi
description: The digital munshi — property dealer operating system for Pakistan
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.4

  # State management — manual providers only (no @riverpod codegen)
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Local database (offline-first)
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # Voice: TTS + STT
  flutter_tts: ^4.2.2
  speech_to_text: ^7.0.0

  # Audio recording
  record: ^5.1.2
  just_audio: ^0.9.42

  # Camera & Images
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  cached_network_image: ^3.4.1

  # Files
  file_picker: ^8.1.7
  share_plus: ^12.0.2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.3
  collection: ^1.19.1
  equatable: ^2.0.7
  connectivity_plus: ^6.1.4
  package_info_plus: ^8.3.0
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  encrypt: ^5.0.3

  # UI Components
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.1
  percent_indicator: ^4.2.3
  fl_chart: ^0.69.0

  # URL launcher
  url_launcher: ^6.3.1

  # open_file — replaced by url_launcher for cross-platform compat
  # lottie — removed (not used in current screens)
  # dotted_border — removed (not used)
  # excel — removed (import screen is Phase 2 stub)
  # reactive_forms — removed (not used anywhere)
  # flutter_vibrate — removed (not used; use HapticFeedback directly)
  # audio_waveforms — removed (not used; custom waveform drawn in SpeakButton)
  # camera — removed (image_picker covers all camera use cases)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation — ONLY drift_dev is needed (no @riverpod / @freezed / @injectable)
  build_runner: ^2.4.15
  drift_dev: ^2.21.0

  # Testing
  mocktail: ^1.0.5
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - .env.dev
    - .env.staging
    - .env.prod
