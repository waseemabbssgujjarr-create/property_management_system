name: munshi
description: The digital munshi — property dealer operating system for Pakistan
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Local database (offline-first)
  drift: ^2.18.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.22
  path_provider: ^2.1.3
  path: ^1.9.0

  # Dependency injection
  get_it: ^7.7.0
  injectable: ^2.4.2

  # Forms
  reactive_forms: ^17.0.0

  # Voice: TTS + STT
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0

  # Audio recording
  record: ^5.1.1
  just_audio: ^0.9.39
  audio_waveforms: ^1.0.5

  # Camera & Images
  image_picker: ^1.1.2
  camera: ^0.10.5+9
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.3.1

  # Files
  file_picker: ^8.0.7
  open_file: ^3.3.2
  share_plus: ^9.0.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  collection: ^1.18.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  encrypt: ^5.0.3

  # UI Components
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.0
  dotted_border: ^2.1.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.68.0

  # Excel import
  excel: ^4.0.3

  # URL launcher
  url_launcher: ^6.3.0

  # Haptics
  flutter_vibrate: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Code generation
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  drift_dev: ^2.18.0
  injectable_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # Testing
  mocktail: ^1.0.4
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/
    - assets/env/
    - .env.dev
    - .env.staging
    - .env.prod

  fonts:
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoNastaliqUrdu-Bold.ttf
          weight: 700

    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoNaskhArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
